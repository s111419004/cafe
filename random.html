    function parseInlineCafes() {
      const lines = INLINE_RAW_DATA.split('\n').map(l => l.trim()).filter(Boolean);
      return lines.map((line, index) => {
        const parts = line.split('|').map(p => p.trim());
        const fullName = parts[0] || '未知名稱';
        const rawCategory = parts[1] || '$200-400 咖啡店';
        const hours = parts[2] || '11:00-19:00';
        const notes = parts[3] || '無特殊備註。';

        let mainTitle = fullName;
        let subTitle = '';
        const enMatch = fullName.match(/^(.*?)([\s\(]+[A-Za-z0-9'\s\.\&·\-]+[\)]?.*)$/);
        if (enMatch && enMatch[1].trim() && enMatch[2].trim()) {
          mainTitle = enMatch[1].trim();
          subTitle = enMatch[2].replace(/^[\s\(]+|[\s\)]+$/g, '').trim();
        }

        const isClosedPermanent = rawCategory.includes('永久歇業') || rawCategory.includes('地點已不存在');
        const isClosedTemp = rawCategory.includes('暫時關閉');

        let price = '$200-400';
        if (rawCategory.includes('$1-200')) price = '$1-200';
        else if (rawCategory.includes('$400-600')) price = '$400-600';
        else if (rawCategory.includes('$400-1,000')) price = '$400-1,000';
        else if (rawCategory.includes('$1-400')) price = '$1-400';

        let region = '雙北捷運市區';
        const textToScan = fullName + ' ' + notes;
        if (/新竹|竹北/.test(textToScan)) region = '新竹地區';
        else if (/台中|豐原|清水/.test(textToScan)) region = '台中地區';
        else if (/嘉義|彰化|員林|鹿港/.test(textToScan)) region = '嘉義/彰化';
        else if (/桃園|中壢/.test(textToScan)) region = '桃園地區';
        else if (/新北|淡水|三峽|三重|中和|永和|板橋|新莊|汐止|樹林|蘆洲/.test(textToScan)) region = '雙北捷運市區';

        let socketDesc = '部分座位有插座';
        if (/滿滿插座|幾乎每個座位都有插頭|每個桌子都有插座|插座充足|每個座位一訂都可以有插頭|皆有插座|座位都有插頭|幾乎所有位子有插座/.test(notes)) {
          socketDesc = '大部分座位有插座';
        } else if (/無插座|不提供插座|沒插座/.test(notes)) {
          socketDesc = '無提供插座';
        }

        let timeDesc = '不限時';
        if (/平日不限時.*客滿限/.test(notes)) {
          timeDesc = '平日不限時 (客滿限時)';
        } else if (/平日不限時/.test(notes)) {
          timeDesc = '平日不限時';
        } else if (/客滿限時?\s*90\s*分鐘|限時\s*90\s*分鐘/.test(notes)) {
          timeDesc = '客滿限 90 分鐘';
        } else if (/客滿限時?\s*2\s*小時|限時\s*2\s*小時/.test(notes)) {
          timeDesc = '客滿限 2 小時';
        } else if (/客滿限時?\s*3\s*小時|限時\s*3\s*小時/.test(notes)) {
          timeDesc = '客滿限 3 小時';
        } else if (/未客滿不限時|沒客滿不限時|無客滿不限時|沒有人候位才不限時|沒滿座就不限時/.test(notes)) {
          timeDesc = '未客滿不限時';
        } else if (/限時/.test(notes)) {
          timeDesc = '客滿限時';
        }

        const tags = [];
        if (!/無插座|不提供插座/.test(notes) && (notes.includes('插座') || notes.includes('插頭') || socketDesc.includes('插座'))) {
          tags.push('有插座');
        }
        if (timeDesc.includes('不限時') || notes.includes('不限時')) {
          tags.push('不限時');
        }
        if (/安靜|讀書|工作|辦公|筆電|專注|自習|念書/.test(notes)) {
          tags.push('適合讀書工作');
        }
        if (/安靜|輕聲|禁止聊天|不能說話|靜謐|靜悄悄/.test(notes)) {
          tags.push('安靜專注');
        }
        if (/深夜|00:00|01:00|02:00|04:00|半夜|凌晨|午夜/.test(notes + ' ' + hours)) {
          tags.push('深夜營業');
        }
        if (/貓|狗|寵物/.test(fullName + ' ' + notes)) {
          tags.push('店貓/寵物友善');
        }
        if (/水餃|炒麵|義大利麵|披薩|吐司|咖哩|正餐|鹹食|早午餐|簡餐/.test(notes)) {
          tags.push('正餐鹹食');
        }

        return {
          id: 'cafe_' + index,
          fullName,
          mainTitle,
          subTitle,
          price,
          hours,
          notes,
          region,
          socketDesc,
          timeDesc,
          tags,
          isClosedPermanent,
          isClosedTemp
        };
      });
    }

    function calculateRealtimeStatus(cafe) {
      if (cafe.isClosedPermanent) return { label: '永久歇業', color: 'bg-stone-200 text-stone-700', isOpenNow: false };
      if (cafe.isClosedTemp) return { label: '暫時關閉', color: 'bg-stone-200 text-stone-700', isOpenNow: false };

      const match = cafe.hours.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
      if (!match) return { label: '營業中', color: 'bg-emerald-100 text-emerald-800', isOpenNow: true };

      const openH = parseInt(match[1], 10);
      const openM = parseInt(match[2], 10);
      let closeH = parseInt(match[3], 10);
      const closeM = parseInt(match[4], 10);

      const now = new Date();
      const curTotalM = now.getHours() * 60 + now.getMinutes();
      const openTotalM = openH * 60 + openM;
      let closeTotalM = closeH * 60 + closeM;

      if (closeTotalM <= openTotalM) closeTotalM += 24 * 60;
      let checkCurrent = curTotalM;
      if (curTotalM < openTotalM && (curTotalM + 24 * 60) < closeTotalM) checkCurrent += 24 * 60;

      if (checkCurrent >= openTotalM && checkCurrent < closeTotalM) {
        if ((closeTotalM - checkCurrent) <= 60) return { label: '即將打烊', color: 'bg-amber-100 text-amber-800', isOpenNow: true };
        return { label: '營業中', color: 'bg-emerald-100 text-emerald-800', isOpenNow: true };
      } else {
        const timeToOpen = (openTotalM > curTotalM) ? (openTotalM - curTotalM) : (openTotalM + 24 * 60 - curTotalM);
        if (timeToOpen <= 60) return { label: '即將開門', color: 'bg-amber-50 text-amber-900 border border-amber-300', isOpenNow: false };
        return { label: '已打烊', color: 'bg-sand/60 text-caramel', isOpenNow: false };
      }
    }

    window.getParsedCafes = function() { return parseInlineCafes(); };
    window.getCafeRealtimeStatus = function(c) { return calculateRealtimeStatus(c); };

    let cafes = [];
    let currentPickMode = 'open';
    let favorites = JSON.parse(localStorage.getItem('cafe_notes_favs') || '[]');

    document.addEventListener('DOMContentLoaded', () => {
      cafes = getParsedCafes();
      updateFavUI();
      // 一載入頁面直接隨機抽一間！
      setTimeout(() => {
        rollRandomCafe(false);
      }, 50);
    });

    function setPickMode(mode) {
      currentPickMode = mode;
      const btnOpen = document.getElementById('pickModeOpen');
      const btnAll = document.getElementById('pickModeAll');
      const notice = document.getElementById('rNoticeText');

      if (mode === 'open') {
        btnOpen.className = "px-3.5 py-1.5 rounded-lg text-[13px] font-bold transition bg-espresso text-white shadow-xs";
        btnAll.className = "px-3.5 py-1.5 rounded-lg text-[13px] font-bold transition text-espresso hover:bg-sand/60";
        notice.textContent = "※ 目前模式：僅自當前營業中的店家盲抽，出門不撲空。";
      } else {
        btnAll.className = "px-3.5 py-1.5 rounded-lg text-[13px] font-bold transition bg-espresso text-white shadow-xs";
        btnOpen.className = "px-3.5 py-1.5 rounded-lg text-[13px] font-bold transition text-espresso hover:bg-sand/60";
        notice.textContent = "※ 目前模式：抽取全部已收錄店家，包含休息中店家。";
      }

      rollRandomCafe(true);
    }

    let rToastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      if (!toast || !toastMsg) return;
      toastMsg.textContent = msg;
      toast.classList.remove('translate-y-16', 'opacity-0');
      clearTimeout(rToastTimer);
      rToastTimer = setTimeout(() => {
        toast.classList.add('translate-y-16', 'opacity-0');
      }, 2200);
    }

    function updateFavUI() {
      const badge = document.getElementById('favBadge');
      const drawerCount = document.getElementById('drawerFavCount');
      if (badge) {
        if (favorites.length > 0) {
          badge.textContent = favorites.length;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      }
      if (drawerCount) drawerCount.textContent = favorites.length;
      renderFavDrawerList();
    }

    function toggleFavDrawer(show) {
      const drawer = document.getElementById('favDrawer');
      if (!drawer) return;
      if (show) {
        updateFavUI();
        drawer.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      } else {
        drawer.classList.add('hidden');
        document.body.style.overflow = '';
      }
    }

    function renderFavDrawerList() {
      const container = document.getElementById('favDrawerList');
      if (!container) return;
      const favList = cafes.filter(c => favorites.includes(c.id));
      if (favList.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center text-caramel">
            <i class="fa-regular fa-bookmark text-2xl mb-2 opacity-50 block"></i>
            <p class="text-[13px]">口袋空空如也，快點擊咖啡卡片書籤進行收藏！</p>
          </div>
        `;
        return;
      }
      container.innerHTML = favList.map(cafe => `
        <div class="py-3 flex items-center justify-between gap-3">
          <div class="flex-1">
            <h4 class="font-bold text-[15px] text-espresso leading-snug">${cafe.mainTitle}</h4>
            <div class="text-[13px] text-caramel flex items-center gap-2 mt-0.5">
              <span>${cafe.region}</span>
              <span>•</span>
              <span>${cafe.hours}</span>
            </div>
          </div>
          <button onclick="removeFav('${cafe.id}')" class="text-caramel hover:text-red-600 p-1.5" title="移除">
            <i class="fa-solid fa-trash-can text-sm"></i>
          </button>
        </div>
      `).join('');
    }

    function removeFav(id) {
      const idx = favorites.indexOf(id);
      if (idx > -1) {
        favorites.splice(idx, 1);
        localStorage.setItem('cafe_notes_favs', JSON.stringify(favorites));
        updateFavUI();
        showToast('已自口袋名單移除');
      }
    }

    function copyAllFavNames() {
      const favList = cafes.filter(c => favorites.includes(c.id));
      if (favList.length === 0) {
        showToast('口袋名單目前沒有店家');
        return;
      }
      const text = favList.map((c, i) => `${i + 1}. ${c.fullName} (${c.region})`).join('\n');
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch(e){}
      document.body.removeChild(ta);
      showToast('已複製收藏清單文字');
    }

    function rollRandomCafe(triggerAnimation = true) {
      if (!cafes || cafes.length === 0) {
        cafes = getParsedCafes();
      }
      let pool = cafes.filter(c => !c.isClosedPermanent && !c.isClosedTemp);

      if (currentPickMode === 'open') {
        const openPool = pool.filter(c => getCafeRealtimeStatus(c).isOpenNow);
        if (openPool.length > 0) {
          pool = openPool;
        } else {
          showToast('當前多數店家已打烊，為您自全部名單抽選');
        }
      }

      if (pool.length === 0) return;

      const diceBox = document.getElementById('diceBox');
      const randomCard = document.getElementById('randomCard');

      if (triggerAnimation && diceBox) {
        diceBox.classList.remove('animate-shake-dice');
        if (randomCard) randomCard.classList.remove('animate-rumble-card');
        void diceBox.offsetWidth;
        diceBox.classList.add('animate-shake-dice');
      }

      const applyData = () => {
        const picked = pool[Math.floor(Math.random() * pool.length)];
        const status = getCafeRealtimeStatus(picked);

        const rStatus = document.getElementById('rStatus');
        if (rStatus) {
          rStatus.textContent = status.label;
          rStatus.className = `text-[13px] font-bold px-2.5 py-0.5 rounded ${status.color}`;
        }
        const rRegion = document.getElementById('rRegion');
        if (rRegion) rRegion.textContent = picked.region;
        const rPrice = document.getElementById('rPrice');
        if (rPrice) rPrice.textContent = picked.price;

        const rMainTitle = document.getElementById('rMainTitle');
        if (rMainTitle) rMainTitle.textContent = picked.mainTitle;
        const subElem = document.getElementById('rSubTitle');
        if (subElem) {
          if (picked.subTitle) {
            subElem.textContent = picked.subTitle;
            subElem.classList.remove('hidden');
          } else {
            subElem.textContent = '';
            subElem.classList.add('hidden');
          }
        }

        const rHours = document.getElementById('rHours');
        if (rHours) rHours.textContent = picked.hours;
        const rNotes = document.getElementById('rNotes');
        if (rNotes) rNotes.textContent = picked.notes;
        const rSocket = document.getElementById('rSocket');
        if (rSocket) rSocket.textContent = picked.socketDesc;
        const rTime = document.getElementById('rTime');
        if (rTime) rTime.textContent = picked.timeDesc;

        const badgesContainer = document.getElementById('rBadges');
        if (badgesContainer) {
          badgesContainer.innerHTML = (picked.tags || []).map(t => `
            <span class="px-2.5 py-1 rounded bg-cream text-espresso font-medium">#${t}</span>
          `).join('');
        }

        const mapBtn = document.getElementById('rMapBtn');
        if (mapBtn) {
          mapBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(picked.fullName)}`;
        }

        if (triggerAnimation && randomCard) {
          randomCard.classList.add('animate-rumble-card');
        }
      };

      if (triggerAnimation) {
        setTimeout(applyData, 260);
      } else {
        applyData();
      }
    }
  </script>
</body>
</html>
